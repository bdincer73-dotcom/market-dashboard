# Tunable rule thresholds for the scoring engine.
# Edit these values to change regime behavior without touching code.
# All percentages are in absolute points (e.g. 50 means 50%, not 0.50).

breadth:
  # "Stable or rising" vs "deteriorating" for the run-over-run delta, in
  # percentage points. Also used as the 200D delta's RED threshold now
  # (200D used to trigger RED on ANY decline at all - fixed to require the
  # same magnitude as 20D/50D).
  stable_delta_min: -1.0
  deteriorating_delta_max: -2.0
  # Level (not delta) checks: 20D+50D both below these -> AMBER ("short-term
  # breadth soft"); 200D alone below its level -> RED ("majority of names
  # below their 200DMA"), independent of what this week's move was.
  weak_20d_level: 40.0
  weak_50d_level: 45.0
  weak_200d_level: 50.0
  # Below this, a breadth reading is treated as lower-confidence -> AMBER,
  # same idea as a FAILED module.
  min_coverage_pct: 95.0

sector_rotation:
  # RSP vs SPY 5D relative return (points) below which RSP is "underperforming" -> RED.
  rsp_underperform_5d: -0.5
  # RSP vs SPY 5D relative return above which RSP "confirms" the rally. Between
  # rsp_underperform_5d and this value, RSP is neither confirming nor
  # underperforming -> AMBER ("not yet confirming").
  rsp_confirm_5d: 0.0
  # Number of top-ranked sectors that must be non-defensive for "broadening" leadership.
  narrow_leadership_rank_threshold: 3

volatility:
  # VIX level bands.
  calm_low: 12.0
  calm_high: 20.0
  elevated_high: 28.0
  # 5D VIX change (points) considered "rising sharply".
  rising_5d: 3.0
  # VIX3M - VIX, compared against the raw diff (not the collector's display
  # label, which always splits at 0 for the tile) - at or below this is
  # backwardation = stress signal -> RED.
  backwardation_threshold: 0.0

rates:
  # 1W move in 2s10s spread (bps) considered "material".
  material_2s10s_move_bps: 10.0

watchlist:
  # Minimum annualized return target for a candidate to pass the return gate.
  min_return_target_pct: 3.5
  min_dte: 30
  max_dte: 40
  # Liquidity gate (blueprint: "Bid/ask width >10% of mid, low OI, or missing
  # Greeks" -> exclude from action list, retain in watch section).
  max_spread_pct_of_mid: 10.0
  min_open_interest: 10
  # Target delta band for a "typical" CSP seller - informational only, not a
  # hard gate. Candidates outside this range still show, just not favored.
  target_delta_low: -0.30
  target_delta_high: -0.10
  earnings_exclusion_days: 30

freshness:
  # Data older than this many calendar days (excluding weekends) is STALE.
  stale_after_days: 1
